services:
  - type: web
    name: reto-03-agente-oc-sap
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-flash-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: MAX_AGENT_ITERATIONS
        value: "25"
      - key: MAX_SESSION_TOKENS
        value: "20000"
      - key: LLM_TIMEOUT_MS
        value: "15000"
      - key: CHAT_RATE_LIMIT
        value: "30"
